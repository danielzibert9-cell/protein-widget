plugins { id 'com.android.application' }

android {
    namespace 'de.zibert.proteinwidget'
    compileSdk 34
    defaultConfig {
        applicationId 'de.zibert.proteinwidget'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "3.1"
    }
    signingConfigs {
        widget {
            storeFile file('widget.keystore')
            storePassword 'widget123'
            keyAlias 'widget'
            keyPassword 'widget123'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.widget
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
