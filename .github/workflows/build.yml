name: APK bauen
on:
  push:
    paths-ignore: ['data.json', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk ProteinWidget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ProteinWidget
          path: ProteinWidget.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Protein-Widget
          files: ProteinWidget.apk
          make_latest: true
